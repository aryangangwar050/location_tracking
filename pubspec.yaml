name: location_tracking
description: Driver route tracking with native GPS and offline synchronization.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  connectivity_plus: 6.1.5
  sqflite: 2.4.2
  http: ^1.6.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.3.6
  # This FFI driver uses the sqlite3 2.x dynamic-library loader.
  sqlite3: ">=2.7.6 <3.0.0"

flutter:
  uses-material-design: true
